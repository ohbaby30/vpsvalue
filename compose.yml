name: vps-value-calculator
services:
  vps-value:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-18086}:8080"
    environment:
      TZ: Asia/Shanghai
      PUBLIC_URL: ${PUBLIC_URL:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
